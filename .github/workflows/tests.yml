name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  benchmark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r benchmark/requirements.txt
      - run: python -m pytest -q benchmark/tests
